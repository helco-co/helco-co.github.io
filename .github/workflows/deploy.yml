name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two publishes at once; let a newer push supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # An <owner>.github.io repo is served from the domain root; any other repo
      # is served from /<repo> and needs that prefix on every asset and link.
      - name: Work out the base path
        id: base
        run: |
          repo='${{ github.event.repository.name }}'
          owner='${{ github.repository_owner }}'
          owner_lc=$(echo "$owner" | tr '[:upper:]' '[:lower:]')
          if [ "$repo" = "$owner_lc.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "Serving from domain root — no base path."
          else
            echo "path=/$repo" >> "$GITHUB_OUTPUT"
            echo "Serving from /$repo."
          fi

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
