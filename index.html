<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELCO — Hany ElAraby & Co</title>
<link rel="canonical" href="/en/">
<meta http-equiv="refresh" content="0; url=/en/">
<style>
  html,body{margin:0;height:100%;background:#0f1419;color:#dee3ea;
    font-family:ui-sans-serif,system-ui,sans-serif}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center}
  a{color:#e1c19a}
</style>
<script>
  // Respect the visitor's language before the meta refresh fires.
  (function () {
    var ar = (navigator.languages || [navigator.language || ""])
      .some(function (l) { return String(l).toLowerCase().indexOf("ar") === 0; });
    location.replace("/" + (ar ? "ar" : "en") + "/");
  })();
</script>
</head>
<body>
  <div class="wrap"><p>Redirecting to <a href="/en/">HELCO</a>&hellip;</p></div>
</body>
</html>
